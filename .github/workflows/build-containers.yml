name: Build container images

"on":
  push:
    branches:
      - main
    paths:
      - "containers/**"
  pull_request:
    branches:
      - main
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated list of images to build (unified,rust-musl). Empty = all."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ruyisdk

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine which images to build
        id: detect
        run: |
          if [[ -n "${{ inputs.images }}" ]]; then
            echo "images=${{ inputs.images }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine the base ref for diff
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          # On push events with no before (e.g. initial push), build all
          if [[ -z "$BASE_REF" || "$BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
            echo "images=unified,rust-musl" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect which container dirs changed
          changed=""
          for dir in containers/*/; do
            kind="$(basename "$dir")"
            [[ "$kind" == "_"* ]] && continue
            if git diff --name-only "$BASE_REF" HEAD -- "$dir" | grep -q .; then
              changed="${changed}${changed:+,}${kind}"
            fi
          done

          echo "images=${changed}" >> "$GITHUB_OUTPUT"

  build-unified:
    name: Build unified builder image
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.images, 'unified')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          source containers/_image_tag_base.sh
          tag="$(image_tag_pkgbuilder unified amd64)"
          echo "full=${tag}" >> "$GITHUB_OUTPUT"
          echo "base=${tag%%:*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*:}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/unified
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.full }}
            ${{ steps.tag.outputs.base }}:latest
          cache-from: type=gha,scope=unified
          cache-to: type=gha,mode=max,scope=unified

  build-rust-musl:
    name: Build rust-musl builder image
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.images, 'rust-musl')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          source containers/_image_tag_base.sh
          tag="$(image_tag_pkgbuilder rust-musl amd64)"
          echo "full=${tag}" >> "$GITHUB_OUTPUT"
          echo "base=${tag%%:*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*:}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/rust-musl
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.full }}
            ${{ steps.tag.outputs.base }}:latest
          cache-from: type=gha,scope=rust-musl
          cache-to: type=gha,mode=max,scope=rust-musl
